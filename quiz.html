<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Fortune Quiz ♥</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght:400;700;900&family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rose: #ff6b9d;
            --deep-rose: #c44569;
            --blush: #ffeef8;
            --cream: #fff5f7;
            --deep-purple: #543864;
            --text: #2d1b2e;
        }

        body {
            font-family: 'Cormorant Garamond', 'Noto Sans TC', serif;
            background: linear-gradient(135deg, var(--blush) 0%, var(--cream) 50%, #ffe9f0 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            color: var(--rose);
            opacity: 0.1;
            animation: float-up 15s infinite ease-in-out;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: var(--deep-purple);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Cormorant Garamond', 'Noto Sans TC', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: var(--deep-rose);
            transform: translateX(-5px);
        }

        .sound-toggle, .lang-toggle {
            background: white;
            border: 2px solid var(--rose);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sound-toggle:hover, .lang-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.2);
        }

        .quiz-container {
            background: white;
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--cream);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--rose), var(--deep-rose));
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-text {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 1.2rem;
            color: var(--deep-purple);
            margin-bottom: 15px;
            text-align: center;
        }

        .question {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 2rem;
            color: var(--deep-rose);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.4;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option {
            background: var(--cream);
            border: 2px solid var(--rose);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
            text-align: center;
        }

        .option:hover {
            background: var(--rose);
            color: white;
            transform: translateX(10px);
        }

        .option.selected {
            background: var(--deep-rose);
            color: white;
            border-color: var(--deep-purple);
        }

        .quiz-controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            font-family: 'Cormorant Garamond', 'Noto Sans TC', serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--rose), var(--deep-rose));
            color: white;
        }

        .btn-secondary {
            background: white;
            color: var(--deep-purple);
            border: 2px solid var(--deep-purple);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            text-align: center;
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .result-container h2 {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 2.5rem;
            color: var(--deep-rose);
            margin-bottom: 20px;
        }

        .result-score {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 1.8rem;
            color: var(--deep-purple);
            margin-bottom: 20px;
        }

        .result-container p {
            font-size: 1.3rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 30px;
        }

        .dashboard {
            background: var(--cream);
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
        }

        .dashboard-title {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 1.8rem;
            color: var(--deep-rose);
            text-align: center;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--rose);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--deep-purple);
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Playfair Display', 'Noto Sans TC', serif;
            font-size: 2rem;
            color: var(--deep-rose);
            font-weight: 700;
        }

        .answer-review {
            margin-top: 20px;
        }

        .answer-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--rose);
        }

        .answer-item strong {
            color: var(--deep-rose);
        }

        @media (max-width: 768px) {
            .quiz-container {
                padding: 30px 20px;
            }

            .question {
                font-size: 1.5rem;
            }

            .option {
                font-size: 1.1rem;
                padding: 15px;
            }

            .top-bar {
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="fireworks-canvas"></canvas>
    <div class="bg-hearts" id="bgHearts"></div>
    
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← <span class="lang-text" data-en="Back to Home" data-zh="返回首页">Back to Home</span></a>
            <div class="controls-group">
                <button class="lang-toggle" onclick="toggleLanguage()" id="langBtn">
                    <span id="langIcon">🌐</span>
                    <span id="langText">中文</span>
                </button>
                <button class="sound-toggle" onclick="toggleSound()" id="soundBtn">
                    <span id="soundIcon">🔊</span>
                </button>
            </div>
        </div>
        <div class="quiz-container" id="quiz-content"></div>
    </div>

    <script>
        // Background floating hearts
        function createBgHearts() {
            const container = document.getElementById('bgHearts');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'bg-heart';
                heart.textContent = '♥';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(heart);
            }
        }
        createBgHearts();

        // Language Management
        let currentLang = 'en';

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            document.getElementById('langText').textContent = currentLang === 'en' ? '中文' : 'English';
            updateLanguage();
            // Refresh current question
            if (currentQuestion < quizQuestions.length) {
                showQuestion();
            }
        }

        function updateLanguage() {
            document.querySelectorAll('.lang-text').forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });
        }

        // Sound Management
        let soundEnabled = true;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequency, duration = 100) {
            if (!soundEnabled) return;
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration / 1000);
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) playSound(600, 100);
        }

        // Quiz Questions (randomized order)
        const quizQuestions = [
            {
                question: { en: "How do you feel about commitment?", zh: "你對承諾的感覺如何？" },
                options: [
                    { text: { en: "I'm ready for a serious, long-term relationship", zh: "我準備好認真的長期關係" }, score: 5 },
                    { text: { en: "I'm open to it with the right person", zh: "遇到對的人我願意" }, score: 4 },
                    { text: { en: "I prefer to take things slow", zh: "我喜歡慢慢來" }, score: 3 },
                    { text: { en: "Commitment scares me", zh: "承諾讓我害怕" }, score: 1 }
                ]
            },
            {
                question: { en: "What's your ideal Valentine's Day date?", zh: "你理想的情人節約會是什麼？" },
                options: [
                    { text: { en: "Romantic candlelit dinner", zh: "浪漫燭光晚餐" }, score: 5 },
                    { text: { en: "Adventure and outdoor activities", zh: "冒險和戶外活動" }, score: 4 },
                    { text: { en: "Cozy movie night at home", zh: "在家看電影" }, score: 3 },
                    { text: { en: "I'd rather stay single", zh: "我寧願保持單身" }, score: 1 }
                ]
            },
            {
                question: { en: "How do you express love?", zh: "你如何表達愛？" },
                options: [
                    { text: { en: "Through heartfelt words and affection", zh: "通過真誠的話語和愛意" }, score: 5 },
                    { text: { en: "With thoughtful gifts and gestures", zh: "用心的禮物和行動" }, score: 4 },
                    { text: { en: "Quality time together", zh: "一起度過美好時光" }, score: 4 },
                    { text: { en: "I don't really express love", zh: "我不太表達愛" }, score: 1 }
                ]
            },
            {
                question: { en: "What matters most in a relationship?", zh: "戀愛中什麼最重要？" },
                options: [
                    { text: { en: "Trust and loyalty", zh: "信任和忠誠" }, score: 5 },
                    { text: { en: "Passion and chemistry", zh: "激情和化學反應" }, score: 4 },
                    { text: { en: "Fun and adventure", zh: "樂趣和冒險" }, score: 3 },
                    { text: { en: "Personal freedom", zh: "個人自由" }, score: 1 }
                ]
            },
            {
                question: { en: "How do you handle conflicts in relationships?", zh: "你如何處理感情中的衝突？" },
                options: [
                    { text: { en: "Talk it through with understanding", zh: "理解地溝通" }, score: 5 },
                    { text: { en: "Take time to cool off, then discuss", zh: "冷靜後再討論" }, score: 4 },
                    { text: { en: "Avoid confrontation", zh: "避免對抗" }, score: 2 },
                    { text: { en: "End things if there's too much drama", zh: "太多戲劇性就結束" }, score: 1 }
                ]
            },
            {
                question: { en: "Your perfect partner is:", zh: "你的完美伴侶是：" },
                options: [
                    { text: { en: "My soulmate who completes me", zh: "完整我的靈魂伴侶" }, score: 5 },
                    { text: { en: "Someone who shares my values", zh: "與我價值觀相同的人" }, score: 4 },
                    { text: { en: "A fun companion for adventures", zh: "冒險的有趣夥伴" }, score: 3 },
                    { text: { en: "I don't believe in 'the one'", zh: "我不相信命中註定" }, score: 1 }
                ]
            },
            {
                question: { en: "How important is romance to you?", zh: "浪漫對你有多重要？" },
                options: [
                    { text: { en: "Extremely - it's the heart of love", zh: "非常重要 - 這是愛的核心" }, score: 5 },
                    { text: { en: "Very important but not everything", zh: "很重要但不是全部" }, score: 4 },
                    { text: { en: "Nice to have occasionally", zh: "偶爾有就好" }, score: 2 },
                    { text: { en: "Romance is overrated", zh: "浪漫被高估了" }, score: 1 }
                ]
            },
            {
                question: { en: "What's your view on love at first sight?", zh: "你對一見鍾情的看法？" },
                options: [
                    { text: { en: "I believe in it wholeheartedly", zh: "我全心相信" }, score: 5 },
                    { text: { en: "It's possible with strong chemistry", zh: "強烈的化學反應可能" }, score: 4 },
                    { text: { en: "Love takes time to develop", zh: "愛需要時間培養" }, score: 3 },
                    { text: { en: "It's just physical attraction", zh: "只是身體吸引力" }, score: 1 }
                ]
            }
        ];

        const quizResults = [
            {
                scoreRange: [0, 12],
                title: { en: "💔 Single Forever", zh: "💔 永遠單身" },
                icon: "😔",
                message: { en: "You seem to have built walls around your heart. Love requires vulnerability and openness. Perhaps it's time to reconsider what truly matters in life? Remember, even the coldest hearts can thaw with the right warmth.", zh: "你似乎在心周圍築起了牆。愛需要脆弱和開放。也許是時候重新考慮生活中真正重要的事情了？記住，即使是最冷的心也能在適當的溫暖下融化。" },
                advice: { en: "Try opening up to new experiences and people. Love might surprise you when you least expect it!", zh: "嘗試對新體驗和新朋友敞開心扉。愛可能會在你最不期待的時候給你驚喜！" }
            },
            {
                scoreRange: [13, 20],
                title: { en: "🌱 Love Skeptic", zh: "🌱 愛情懷疑者" },
                icon: "🤔",
                message: { en: "You're hesitant about love, perhaps due to past experiences or personal preferences. While independence is valuable, don't let fear keep you from meaningful connections. Love doesn't always follow a script.", zh: "你對愛情猶豫不決，也許是因為過去的經歷或個人偏好。雖然獨立很寶貴，但不要讓恐懼阻止你建立有意義的聯繫。愛情並不總是按照劇本進行。" },
                advice: { en: "Take small steps toward opening your heart. Start with friendship and see where it leads.", zh: "邁出小步驟，敞開你的心扉。從友誼開始，看看它會帶你去哪裡。" }
            },
            {
                scoreRange: [21, 28],
                title: { en: "💕 Cautious Romantic", zh: "💕 謹慎的浪漫主義者" },
                icon: "😊",
                message: { en: "You believe in love but approach it carefully. You're practical yet hopeful, balancing dreams with reality. Your measured approach will help you find someone who truly appreciates you.", zh: "你相信愛情，但謹慎對待。你既實際又充滿希望，平衡夢想與現實。你謹慎的態度會幫助你找到真正欣賞你的人。" },
                advice: { en: "Trust your instincts but don't overthink every moment. Sometimes magic happens when we let our guard down.", zh: "相信你的直覺，但不要過度思考每一刻。有時候當我們放下戒備時，魔法就會發生。" }
            },
            {
                scoreRange: [29, 35],
                title: { en: "💖 True Romantic", zh: "💖 真正的浪漫主義者" },
                icon: "😍",
                message: { en: "Your heart is full of love and hope! You believe in the magic of romance and aren't afraid to express your feelings. Your passionate nature attracts kindred spirits who appreciate genuine affection.", zh: "你的心充滿愛和希望！你相信浪漫的魔力，不害怕表達你的感受。你熱情的本性吸引著欣賞真誠情感的靈魂伴侶。" },
                advice: { en: "Keep your beautiful outlook while staying grounded. The perfect balance of romance and reality awaits you!", zh: "保持你美好的觀點，同時保持腳踏實地。浪漫與現實的完美平衡等待著你！" }
            },
            {
                scoreRange: [36, 40],
                title: { en: "👑 Soulmate Magnet", zh: "👑 靈魂伴侶磁鐵" },
                icon: "🥰",
                message: { en: "You are a beacon of love and devotion! Your deep capacity for commitment and genuine romantic spirit makes you irresistible to those seeking true partnership. You don't just believe in soulmates - you embody the qualities that create them.", zh: "你是愛和奉獻的燈塔！你深厚的承諾能力和真誠的浪漫精神使你對尋求真正伴侶關係的人來說無法抗拒。你不僅相信靈魂伴侶 - 你體現了創造靈魂伴侶的品質。" },
                advice: { en: "Your love will inspire others. Stay true to your romantic heart - your perfect match is drawn to exactly who you are!", zh: "你的愛會激勵他人。忠於你浪漫的心 - 你的完美伴侶正被你本來的樣子所吸引！" }
            }
        ];

        let currentQuestion = 0;
        let quizAnswers = [];
        let selectedOption = -1;
        let totalScore = 0;
        let shuffledOptions = [];

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startQuiz() {
            currentQuestion = 0;
            quizAnswers = [];
            selectedOption = -1;
            totalScore = 0;
            showQuestion();
        }

        function showQuestion() {
            const container = document.getElementById('quiz-content');
            if (currentQuestion < quizQuestions.length) {
                const q = quizQuestions[currentQuestion];
                const progress = ((currentQuestion) / quizQuestions.length) * 100;
                
                // Shuffle options for this question
                shuffledOptions = shuffleArray(q.options);
                
                const progressText = currentLang === 'en' ? `Question ${currentQuestion + 1} of ${quizQuestions.length}` : `問題 ${currentQuestion + 1} / ${quizQuestions.length}`;
                const prevText = currentLang === 'en' ? 'Previous' : '上一題';
                const nextText = currentLang === 'en' ? 'Next' : '下一題';
                
                container.innerHTML = `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="progress-text">${progressText}</div>
                    <h2 class="question">${q.question[currentLang]}</h2>
                    <div class="options">
                        ${shuffledOptions.map((opt, idx) => 
                            `<div class="option" onclick="selectOption(${idx})" id="option-${idx}">${opt.text[currentLang]}</div>`
                        ).join('')}
                    </div>
                    <div class="quiz-controls">
                        ${currentQuestion > 0 ? `<button class="btn btn-secondary" onclick="previousQuestion()">← ${prevText}</button>` : ''}
                        <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn" disabled>${nextText} →</button>
                    </div>
                `;
                selectedOption = -1;
            } else {
                showQuizResult();
            }
        }

        function selectOption(idx) {
            playSound(800, 150);
            selectedOption = idx;
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            document.getElementById(`option-${idx}`).classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (selectedOption === -1) return;
            
            playSound(1000, 200);
            const answer = shuffledOptions[selectedOption];
            quizAnswers.push({
                question: quizQuestions[currentQuestion].question[currentLang],
                answer: answer.text[currentLang],
                score: answer.score
            });
            totalScore += answer.score;
            
            currentQuestion++;
            selectedOption = -1;
            showQuestion();
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                playSound(600, 150);
                currentQuestion--;
                const lastAnswer = quizAnswers.pop();
                totalScore -= lastAnswer.score;
                selectedOption = -1;
                showQuestion();
            }
        }

        function showQuizResult() {
            playSound(1200, 500);
            
            const result = quizResults.find(r => 
                totalScore >= r.scoreRange[0] && totalScore <= r.scoreRange[1]
            );
            
            const maxScore = quizQuestions.length * 5;
            const percentage = Math.round((totalScore / maxScore) * 100);
            
            const scoreText = currentLang === 'en' ? `Your Love Score: ${totalScore}/${maxScore} (${percentage}%)` : `你的愛情分數：${totalScore}/${maxScore} (${percentage}%)`;
            const adviceLabel = currentLang === 'en' ? 'Advice' : '建議';
            const dashboardTitle = currentLang === 'en' ? 'Your Love Profile' : '你的愛情檔案';
            const totalScoreLabel = currentLang === 'en' ? 'Total Score' : '總分';
            const loveLevelLabel = currentLang === 'en' ? 'Love Level' : '愛情程度';
            const questionsLabel = currentLang === 'en' ? 'Questions' : '問題';
            const answersTitle = currentLang === 'en' ? 'Your Answers:' : '你的答案：';
            const retryBtn = currentLang === 'en' ? 'Take Quiz Again ♥' : '重新測驗 ♥';
            
            document.getElementById('quiz-content').innerHTML = `
                <div class="result-container">
                    <div class="result-icon">${result.icon}</div>
                    <h2>${result.title[currentLang]}</h2>
                    <div class="result-score">${scoreText}</div>
                    <p>${result.message[currentLang]}</p>
                    <p><strong>💡 ${adviceLabel}:</strong> ${result.advice[currentLang]}</p>
                    
                    <div class="dashboard">
                        <div class="dashboard-title">📊 ${dashboardTitle}</div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-label">${totalScoreLabel}</div>
                                <div class="stat-value">${totalScore}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${loveLevelLabel}</div>
                                <div class="stat-value">${percentage}%</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">${questionsLabel}</div>
                                <div class="stat-value">${quizQuestions.length}</div>
                            </div>
                        </div>
                        
                        <div class="answer-review">
                            <h3 style="color: var(--deep-rose); margin-bottom: 15px;">${answersTitle}</h3>
                            ${quizAnswers.map((ans, idx) => `
                                <div class="answer-item">
                                    <strong>Q${idx + 1}:</strong> ${ans.question}<br>
                                    <span style="color: var(--deep-purple);">→ ${ans.answer} (${ans.score} pts)</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <button class="btn btn-primary" style="margin-top: 30px;" onclick="startQuiz()">${retryBtn}</button>
                </div>
            `;
        }

        // Start the quiz when page loads
        startQuiz();
    </script>

    <script src="fireworks.js"></script>
    <script>
        // Initialize fireworks
        let fireworks = null;
        window.addEventListener('load', () => {
            fireworks = initValentineFireworks();
        });
    </script>
</body>
</html>
